name: webserver

services:
  # DDClient (IP dinámica)
  DDClient:
    image: linuxserver/ddclient
    container_name: DDClient
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - DDClient_config:/etc/ddclient/ #/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "ddclient", "|", "grep", "-v", "grep"]
      interval: 60s
      timeout: 10s
      retries: 3
    mem_limit: 128M
    cpus: 0.1
    networks:
      - webserver_update_network

  # LetsEncrypt (para certificado y Nginx como web server)
  WebServer:
    image: linuxserver/swag
    container_name: WebServer
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - URL=${URL}
      - SUBDOMAINS=${SUBDOMAINS}
      - ONLY_SUBDOMAINS=false
      - VALIDATION=http
      - EMAIL=${ADMIN_EMAIL}
    volumes:
      - WebEncrypt_config:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health", "||", "curl", "-f", "http://localhost/health"]
      interval: 1m
      timeout: 10s
      retries: 3
    mem_limit: 1G
    cpus: 0.4
    networks:
      - webserver_update_network
      - web_network

  # Watchtower (actualizacion automatica)
  Watchtower:
    image: nickfedor/watchtower
    container_name: Watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PUID=1000
      - PGID=1000
      - DOCKER_API_VERSION=1.44
      - TZ=Europe/Madrid
    restart: unless-stopped
    command: --cleanup --interval 3600
    mem_limit: 128M
    cpus: 0.10
    networks:
      - webserver_update_network
      - nextcloud_update_network
      - immich_update_network
      - vaultwarden_update_network
      - forgejo_update_network
      - calibre_update_network
      - nodecast_update_network
      - homepage_update_network
      - crafty_update_network
      - paperless_update_network
      - stremio_update_network
      - netbird_update_network
      - rustdesk_update_network
      - dispatcharr_update_network
      - stirling_update_network
      - hermes_update_network

