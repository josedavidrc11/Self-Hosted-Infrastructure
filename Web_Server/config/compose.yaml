  DDClient_config:
    name: DDClient_config
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Web_Server/volumes/ddclient/config
      o: bind
  WebEncrypt_config:
    name: WebEncrypt_config
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Web_Server/volumes/webserver/config
      o: bind

