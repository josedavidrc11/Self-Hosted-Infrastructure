server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name netbird.example.com;

    http2 on;
    include /config/nginx/ssl.conf;

    # 1. TRÁFICO gRPC (Management y Signal)
    # Estos deben ir primero para evitar que 'location /' los intercepte mal
    location /management.ManagementService/ {
        grpc_pass grpc://netbird-server:80;
        grpc_set_header Host $host;
        grpc_read_timeout 24h;
        grpc_send_timeout 24h;
        grpc_socket_keepalive on;
    }

    location /signalexchange.SignalExchange/ {
        grpc_pass grpc://netbird-server:80;
        grpc_set_header Host $host;
        grpc_read_timeout 24h;
        grpc_send_timeout 24h;
        grpc_socket_keepalive on;
    }

    # 2. TRÁFICO DEL RELAY (WebSockets) - ¡ESTO TE FALTA!
    # Sin esto, el iPhone o Windows no pueden usar el nodo como Exit Node si hay fuego en el medio
    location /relay {
        proxy_pass http://netbird-server:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 3. API Y OAUTH
    location /api/ {
        proxy_pass http://netbird-server:80;
        include /config/nginx/proxy.conf;
    }

    location /oauth2/ {
        proxy_pass http://netbird-server:80;
        include /config/nginx/proxy.conf;
    }

    # 4. DASHBOARD (La raíz siempre al final)
    location / {
        proxy_pass http://netbird-dashboard:80;
        include /config/nginx/proxy.conf;
    }
}
