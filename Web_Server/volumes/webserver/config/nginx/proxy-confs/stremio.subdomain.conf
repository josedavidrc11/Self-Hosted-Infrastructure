server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stremio.example.com;
    include /config/nginx/ssl.conf;

location / {
    include /config/nginx/resolver.conf;
    set $upstream_app Stremio;
    set $upstream_port 11470;
    set $upstream_proto http;

    # Redirección inicial (Solo para la raíz)
    if ($request_uri = "/") {
        return 302 https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2Fstremio.example.com;
    }

    proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    # Cabeceras estándar de Proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # --- MANEJO DE CORS SIMPLIFICADO ---
    # Eliminamos las cabeceras que el servidor pueda estar enviando para evitar duplicados
    proxy_hide_header 'Access-Control-Allow-Origin';
    add_header 'Access-Control-Allow-Origin' '*' always;
    
    # Soporte para streaming y websockets
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
}
