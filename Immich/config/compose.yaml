name: immich

services:
  ImmichServer:
    image: ghcr.io/immich-app/immich-server:release
    container_name: ImmichServer
    depends_on:
      - PostgresImmich
      - ImmichRedis
    environment:
      DB_HOSTNAME: PostgresImmich
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: ImmichRedis
      IMMICH_MACHINE_LEARNING_URL: http://ImmichML:3003
      NODE_ENV: production
    volumes:
      - Immich_upload:/usr/src/app/upload
      - Immich_library:/usr/src/app/library
    mem_limit: 2G
    cpus: 1.00
    networks:
      - immich_network
      - immich_update_network
      - web_network
    restart: unless-stopped

  PostgresImmich:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: PostgresImmich
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_DB: ${IMMICH_DB_NAME}
    volumes:
      - Immich_postgres:/var/lib/postgresql/data
    mem_limit: 2G
    cpus: 1.00
    networks:
      - immich_network
      - immich_update_network

  ImmichML:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: ImmichML
    mem_limit: 1G
    cpus: 0.50
    networks:
      - immich_network
      - immich_update_network
    restart: unless-stopped

  ImmichRedis:
    image: redis:6-alpine
    container_name: ImmichRedis
    restart: unless-stopped
    volumes:
      - ImmichRedis:/data
    mem_limit: 256M
    cpus: 0.25
    networks:
      - immich_network
      - immich_update_network

networks:
  immich_update_network:
    external: true
  immich_network:
    name: immich_network
    driver: bridge
    internal: true
  web_network:
    external: true

volumes:
  Immich_postgres:
    name: Immich_postgres
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Immich/volumes/immich/postgres
      o: bind
  Immich_upload:
    name: Immich_upload
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Immich/volumes/immich/upload
      o: bind
  Immich_library:
    name: Immich_library
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Immich/volumes/immich/library
      o: bind
  ImmichRedis:
    name: ImmichRedis
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Immich/volumes/redis/dataimmich
      o: bind
