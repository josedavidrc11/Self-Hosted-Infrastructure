name: Firefly

services:
  Firefly_DB:
    image: mariadb:lts
    container_name: Firefly_DB
    restart: always
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=firefly
    volumes:
      - Firefly_db_data:/var/lib/mysql
    networks:
      - firefly_network
      - firefly_update_network

  Firefly_app:
    image: fireflyiii/core:latest
    container_name: Firefly_app
    restart: always
    env_file: .env
    volumes:
      - Firefly_app_upload:/var/www/html/storage/upload
    depends_on:
      - Firefly_DB
    networks:
      - firefly_network
      - firefly_update_network
      - web_network

networks:
  firefly_network:
    name: firefly_network
    driver: bridge
    internal: true
  firefly_update_network:
    external: true
  web_network:
    external: true

volumes:
  Firefly_db_data:
    name: Firefly_db_data
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Firefly/volumes/db_data
      o: bind
  Firefly_app_upload:
    name: Firefly_app_upload
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Firefly/volumes/uploads
      o: bind