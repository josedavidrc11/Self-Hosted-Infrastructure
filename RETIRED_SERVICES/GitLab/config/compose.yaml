name: gitlab

services:
  GitLab:
    image: gitlab/gitlab-ce:latest
    container_name: GitLab
    hostname: gitbor.example.com
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitbor.example.com'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
    volumes:
      - GitLab_config:/etc/gitlab
      - GitLab_logs:/var/log/gitlab
      - GitLab_data:/var/opt/gitlab
    ports:
      - "2224:22"
    restart: unless-stopped
    shm_size: '256m'
    mem_limit: 5G
    cpus: 2.00
    networks:
      - gitlab_update_network
      - web_network

networks:
  gitlab_update_network:
    external: true
  web_network:
    external: true

volumes:
  GitLab_config:
    name: GitLab_config
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/GitLab/volumes/gitlab/config
      o: bind
  GitLab_logs:
    name: GitLab_logs
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/GitLab/volumes/gitlab/logs
      o: bind
  GitLab_data:
    name: GitLab_data
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/GitLab/volumes/gitlab/data
      o: bin