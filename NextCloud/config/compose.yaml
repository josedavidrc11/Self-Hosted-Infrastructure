name: nextcloud

services:
 # NextCloud
  NextCloud:
    image: nextcloud
    container_name: NextCloud
    environment:
      - MYSQL_DATABASE=${MYSQL_DB}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=MySQL
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_INTERNED_STRINGS_BUFFER=16
      - PHP_OPCACHE_REVALIDATE_FREQ=60
    volumes:
      - NextCloud_data:/var/www/html
      - NextCloud_config:/var/www/html/config
      - NextCloud_user_files:/var/www/html/data
    depends_on:
      - MySQL
      - Redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 5G
    cpus: 2
    networks:
      - nextcloud_update_network
      - nextcloud_network
      - web_network

  # MySQL (base de datos)
  MySQL:
    image: mysql:8.0
    container_name: MySQL
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - MySQL_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 3G
    cpus: 1.5
    networks:
      - nextcloud_update_network
      - nextcloud_network

  # Redis (caché de archivos y sesiones)
  Redis:
    image: redis:alpine
    container_name: Redis
#    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - Redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512M
    cpus: 0.50
    networks:
      - nextcloud_update_network
      - nextcloud_network

  # Cron
  Cron:
    image: nextcloud
    container_name: Cron
    entrypoint: /cron.sh
    user: www-data
    depends_on:
      - MySQL
    volumes:
      - /SERVICES/NextCloud/volumes/scripts/cron.sh:/cron.sh
      - NextCloud_data:/var/www/html
      - NextCloud_config:/var/www/html/config
      - NextCloud_user_files:/var/www/html/data
    restart: unless-stopped
    mem_limit: 256M
    cpus: 0.2
    networks:
      - nextcloud_update_network
      - nextcloud_network

networks:
  nextcloud_update_network:
    external: true
  nextcloud_network:
    name: nextcloud_network
    driver: bridge
    internal: true
  web_network:
    external: true

volumes:
  MySQL_data:
    name: MySQL_data
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/NextCloud/volumes/mysql/data
      o: bind
  NextCloud_config:
    name: NextCloud_config
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/NextCloud/volumes/nextcloud/config
      o: bind
  NextCloud_data:
    name: NextCloud_data
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/NextCloud/volumes/nextcloud/data
      o: bind
  NextCloud_user_files:
    name: NextCloud_user_files
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/NextCloud/volumes/nextcloud/user_files
      o: bind
  Redis_data:
    name: Redis_data
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/NextCloud/volumes/redis/data
      o: bind
