name: hermes

services:
  HermesAgent:
    image: nousresearch/hermes-agent:latest
    container_name: HermesAgent
    command: gateway run
    environment:
      TZ: Europe/Madrid
      PUID: ${HERMES_PUID}
      PGID: ${HERMES_PGID}
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET}
      # API compatible con OpenAI (opcional, descomenta si la necesitas)
      # API_SERVER_ENABLED: true
      # API_SERVER_HOST: 0.0.0.0
      # API_SERVER_KEY: ${HERMES_API_KEY}
    volumes:
      - Hermes_data:/opt/data
    networks:
      - hermes_update_network
      - web_network
    restart: unless-stopped

networks:
  hermes_update_network:
    external: true
  web_network:
    external: true

volumes:
  Hermes_data:
    name: Hermes_data
    driver: local
    driver_opts:
      type: none
      device: /SERVICES/Hermes/volumes/data
      o: bind
